            height="54"
          />
          <div>
            <p class="brand-kicker">ApplyHub</p>
            <h1>원서접수시스템</h1>
          </div>
        </button>

        <nav class="nav-group" aria-label="주 메뉴">
          <details class="nav-section" open>
            <summary class="nav-section-toggle">
              <span class="nav-section-title">접수 및 등록</span>
              <span class="nav-section-caret" aria-hidden="true"></span>
            </summary>
            <div class="nav-section-items">
              <button class="nav-item" data-view="applicantRecruitmentManagement" type="button">

                    <path d="M17.5 16.5h2"></path>
                    <circle cx="16" cy="16.5" r="1.75"></circle>
                  </svg>
                </span>
                <span>전형 관리</span>
              </button>
              <button class="nav-item" data-view="applicantScheduleManagement" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <rect x="4.5" y="6" width="15" height="13.5" rx="2"></rect>
                    <path d="M8 4.5v3"></path>
                    <path d="M16 4.5v3"></path>
                    <path d="M4.5 9.5h15"></path>
                    <path d="M8 13h3"></path>
                    <path d="M13 13h3"></path>
                    <path d="M8 16.5h8"></path>
                  </svg>
                </span>
                <span>일정 관리</span>
              </button>
              <button class="nav-item" data-view="applicantQuestionTemplateManagement" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M6 5.5h12A1.5 1.5 0 0 1 19.5 7v10A1.5 1.5 0 0 1 18 18.5H6A1.5 1.5 0 0 1 4.5 17V7A1.5 1.5 0 0 1 6 5.5Z"></path>

                    <path d="M8 12h8"></path>
                    <path d="M8 14.75h5"></path>
                  </svg>
                </span>
                <span>가입·접수 설정</span>
              </button>
              <button class="nav-item" data-view="applicantMembers" type="button">

              </button>
              <button class="nav-item" data-view="applicantHistory" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M6 4.5h9l3 3V19a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 19V6A1.5 1.5 0 0 1 6.5 4.5H10"></path>
                    <path d="M15 4.5V8h3"></path>
                    <path d="M8 11h8"></path>
                    <path d="M8 14.5h8"></path>
                  </svg>
                </span>
                <span>접수 이력</span>
              </button>
              <button class="nav-item" data-view="applicantDocumentManagement" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M6 4.5h9l3 3V19a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 19V6A1.5 1.5 0 0 1 6.5 4.5H10"></path>

                  </svg>
                </span>
                <span>서류 제출 관리</span>
              </button>
            </div>
          </details>

          <details class="nav-section" open>
            <summary class="nav-section-toggle">
              <span class="nav-section-title">수험표 관리</span>
              <span class="nav-section-caret" aria-hidden="true"></span>
            </summary>
            <div class="nav-section-items">
              <button class="nav-item" data-view="admitCardLookup" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="5"></circle>
                    <path d="M20 20l-4.1-4.1"></path>
                    <path d="M9 11h4"></path>
                  </svg>
                </span>
                <span>수험표 출력</span>
              </button>
              <button class="nav-item" data-view="printHistory" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M7 8V4.5h10V8"></path>
                    <path d="M6 18H5a2 2 0 0 1-2-2v-5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v5a2 2 0 0 1-2 2h-1"></path>
                    <path d="M7 14h10v5.5H7z"></path>
                    <path d="M16 11.5h2"></path>
                  </svg>
                </span>
                <span>수험표 출력 이력</span>
              </button>
              <button class="nav-item" data-view="templateManagement" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="5" width="16" height="14" rx="2"></rect>
                    <path d="M9 5v14"></path>
                    <path d="M9 10h11"></path>
                  </svg>
                </span>
                <span>수험표 양식 설정</span>
              </button>
            </div>
          </details>

          <details class="nav-section" open>
            <summary class="nav-section-toggle">
              <span class="nav-section-title">시스템 관리</span>
              <span class="nav-section-caret" aria-hidden="true"></span>
            </summary>
            <div class="nav-section-items">
              <button class="nav-item" data-view="loginNoticeSettings" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M4.5 6.5h15"></path>
                    <path d="M4.5 12h15"></path>
                    <path d="M4.5 17.5h10"></path>
                    <circle cx="18" cy="17.5" r="1.5"></circle>
                  </svg>
                </span>
                <span>공지사항 설정</span>
              </button>
              <button class="nav-item" data-view="accountManagement" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <circle cx="9" cy="8" r="3"></circle>
                    <circle cx="17" cy="9" r="2.5"></circle>
                    <path d="M3.5 19c0-2.85 2.42-5 5.5-5s5.5 2.15 5.5 5"></path>
                    <path d="M14.5 18c.25-1.95 1.84-3.5 4-3.5 1.04 0 2 .35 2.76.94"></path>
                  </svg>
                </span>
                <span>계정 관리</span>
              </button>
              <button class="nav-item" data-view="systemSettings" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19 12a7 7 0 0 0-.08-1l2.05-1.6-2-3.46-2.48 1a7.03 7.03 0 0 0-1.73-1L14.5 3h-5l-.26 2.94a7.03 7.03 0 0 0-1.73 1l-2.48-1-2 3.46L5.08 11A7 7 0 0 0 5 12c0 .34.03.67.08 1l-2.05 1.6 2 3.46 2.48-1a7.03 7.03 0 0 0 1.73 1L9.5 21h5l.26-2.94a7.03 7.03 0 0 0 1.73-1l2.48 1 2-3.46L18.92 13c.05-.33.08-.66.08-1Z"></path>
                  </svg>
                </span>
                <span>시스템 설정</span>
              </button>
            </div>
          </details>

          <details class="nav-section" open>
            <summary class="nav-section-toggle">
              <span class="nav-section-title">슈퍼관리자</span>
              <span class="nav-section-caret" aria-hidden="true"></span>
            </summary>
            <div class="nav-section-items">
              <button class="nav-item" data-view="superAdminManagement" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M12 3.5 14.7 8l5-.1-3 3.8 1.15 4.8L12 13.8 7.15 16.5 8.3 11.7l-3-3.8 5 .1Z"></path>
                    <path d="M8.5 19.5h7"></path>
                  </svg>
                </span>
                <span>슈퍼관리자</span>
              </button>
              <button class="nav-item" data-view="systemBackupRestore" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M12 4v6.5"></path>
                    <path d="m8.5 8.5 3.5 3.5 3.5-3.5"></path>
                    <path d="M5 14.5v2A2.5 2.5 0 0 0 7.5 19h9A2.5 2.5 0 0 0 19 16.5v-2"></path>
                    <path d="M12 20v-6.5"></path>
                    <path d="m15.5 15.5-3.5-3.5-3.5 3.5"></path>
                  </svg>
                </span>
                <span>백업 및 복구</span>
              </button>
              <button class="nav-item" data-view="systemDataDeletion" type="button">
                <span class="nav-icon-wrap" aria-hidden="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M4.5 7.5h15"></path>
                    <path d="M9.5 7.5V5.75a1.25 1.25 0 0 1 1.25-1.25h2.5a1.25 1.25 0 0 1 1.25 1.25V7.5"></path>
                    <path d="M7.5 7.5v11A1.5 1.5 0 0 0 9 20h6a1.5 1.5 0 0 0 1.5-1.5v-11"></path>
                    <path d="M10 11v5.5"></path>
                    <path d="M14 11v5.5"></path>

        <footer class="sidebar-footer">
          COPYRIGHT(c) 2026 BY U-PLUS SYSTEM. ALL RIGHTS RESERVED.
        </footer>

      </aside>

      <div class="page-shell" id="pageShell">
        <header class="topbar hidden" id="topbar">
          <div class="topbar-center">
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">
              <span></span><span></span><span></span>
            </button>
            <div class="topbar-session-timer hidden" id="autoLogoutCountdown" title="활동이 없으면 자동 로그아웃됩니다.">
              <span class="topbar-session-timer-label">자동 로그아웃</span>
              <strong class="topbar-session-timer-value" id="autoLogoutCountdownValue">00:00</strong>
            </div>
          </div>

          <div class="topbar-right">
            <applyhub-theme-toggle></applyhub-theme-toggle>
            <div class="user-meta">
              <strong id="currentUserId">로그인 필요</strong>
              <span id="currentUserRole"></span>
            </div>
            <button class="ghost-button topbar-logout-button" data-auth-logout="true" id="logoutButton" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M14 7.5V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2v-1.5"></path>
                <path d="M10 12h9"></path>
                <path d="m16 8 4 4-4 4"></path>
              </svg>
              <span>로그아웃</span>
            </button>
          </div>
        </header>

        <main class="content-area" id="viewRoot"></main>
      </div>
    </div>

    <!-- admit-card:index-modals -->

    <div class="toast-root" id="toastRoot" aria-live="polite" aria-atomic="true"></div>
    <div class="busy-overlay hidden" id="pdfGenerationOverlay" aria-hidden="true">
      <div class="busy-overlay-backdrop"></div>
      <section class="busy-overlay-panel" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="busy-spinner" aria-hidden="true"></div>
        <strong>수험표 파일 생성 중</strong>
        <p id="pdfGenerationMessage">잠시만
기다려 주세요.</p>
        <div class="busy-overlay-progress hidden" id="pdfGenerationProgress" aria-hidden="true">
          <div class="busy-overlay-progress-meta">
            <span id="pdfGenerationProgressLabel">파일 생성 진행률</span>
            <span class="busy-overlay-progress-value" id="pdfGenerationProgressValue">진행 중</span>
          </div>
          <div class="progress-bar" id="pdfGenerationProgressBar">
            <span id="pdfGenerationProgressFill"></span>
          </div>
        </div>
        <button
          class="busy-overlay-cancel-button hidden"
          id="pdfGenerationCancelButton"
          data-cancel-batch-print="true"
          type="button"
        >
          작업 취소
        </button>
      </section>
    </div>

    <div class="table-cell-tooltip hidden" id="tableCellTooltip" role="tooltip" aria-hidden="true"></div>

    <script src="/client/features/applicant-public/form-feedback.js"></script>
    <!-- admit-card:index-scripts -->
  </body>
</html>
